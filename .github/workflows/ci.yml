name: Blaze Quality & Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Shell Syntax & Critical Checks
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
          find blazeos_custom_apps/usr/bin blazeos_custom_apps/usr/libexec packaging scripts -type f \( -name "*.sh" -o -perm -111 \) | while read -r script; do
            if head -n1 "$script" | grep -qE "bash|/bin/sh|/usr/bin/sh"; then
              bash -n "$script"
            fi
          done
          shellcheck -S error -e SC1090,SC1091,SC2034,SC2154 packaging/*.sh scripts/*.sh

      - name: Desktop File Validation
        run: |
          find blazeos_custom_apps/usr/share/applications -name "*.desktop" -exec desktop-file-validate {} +

      - name: Python Syntax & Unit/Regression Validation
        run: |
          python3 -m py_compile blazeos_custom_apps/usr/bin/berp-recovery-gui
          python3 -m py_compile blazeos_custom_apps/usr/bin/blaze-ghost-overlay
          python3 -m unittest tests.test_audit_regressions
          python3 -m tests.e2e.run_e2e --tier unit

      - name: Verify Repository URL & Hygiene Rules
        run: |
          if grep -rn "DarkMorpheus-pc/Blaze-Galaxy" README.md packaging/ blazeos_custom_apps/etc/os-release blazeos_custom_apps/usr/share/dnf5/; then
            echo "ERROR: Stale Blaze-Galaxy URL detected!" >&2
            exit 1
          fi
          ! grep -q "/home/" Blaze-SolarEvolution-5-x86_64.iso.sha256
