schema_version: 1
distro: "Blaze SolarEvolution 5.05.1"
base_distro: "fedora:45"

# Every path under blazeos_custom_apps/ MUST match at least one explicit rule below.
# Classes:
#   first-party-rpm       : Installed via signed Blaze RPM from packaging/out/repo and tracked in rpmdb.sqlite.
#   fedora-config-override: Overrides a stock Fedora RPM-owned path (e.g., sddm.conf, pam.d, anaconda-core)
#                           intentionally applied during image assembly without DNF5 file conflict.
#   third-party-vendor    : External prebuilt binaries, libraries, fonts, themes, or runtime assets
#                           (honestly attributed upstream rather than mislabeled as Blaze-authored).
#   excluded              : Ephemeral build stamps, Python bytecode caches, or non-shipped dev/secret patterns.

rules:
  # --- First-Party Blaze RPMs ---
