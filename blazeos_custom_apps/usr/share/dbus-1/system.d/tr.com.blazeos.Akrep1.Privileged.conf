<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own tr.com.blazeos.Akrep1.Privileged -->
  <policy user="root">
    <allow own="tr.com.blazeos.Akrep1.Privileged"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"/>
  </policy>

  <!-- Desktop callers may invoke PrivilegedManager methods; Polkit system-bus-name auth is enforced inside akrep-privd -->
  <policy context="default">
    <deny own="tr.com.blazeos.Akrep1.Privileged"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"
           send_interface="tr.com.blazeos.Akrep1.PrivilegedManager"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="tr.com.blazeos.Akrep1.Privileged"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
  </policy>
</busconfig>
