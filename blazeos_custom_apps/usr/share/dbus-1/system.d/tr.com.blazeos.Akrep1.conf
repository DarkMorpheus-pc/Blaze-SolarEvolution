<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the dedicated akrep service user or root may own tr.com.blazeos.Akrep1 -->
  <policy user="akrep">
    <allow own="tr.com.blazeos.Akrep1"/>
    <allow send_destination="tr.com.blazeos.Akrep1"/>
  </policy>
  <policy user="root">
    <allow own="tr.com.blazeos.Akrep1"/>
    <allow send_destination="tr.com.blazeos.Akrep1"/>
  </policy>

  <!-- Grant akrep read-only access to FirewallD1 zone/service inspection -->
  <policy user="akrep">
    <allow send_destination="org.fedoraproject.FirewallD1"
           send_interface="org.fedoraproject.FirewallD1"
           send_member="getDefaultZone"/>
    <allow send_destination="org.fedoraproject.FirewallD1"
           send_interface="org.fedoraproject.FirewallD1.zone"
           send_member="getActiveZones"/>
    <allow send_destination="org.fedoraproject.FirewallD1"
           send_interface="org.fedoraproject.FirewallD1.zone"
           send_member="getServices"/>
    <allow send_destination="org.fedoraproject.FirewallD1"
           send_interface="org.fedoraproject.FirewallD1.zone"
           send_member="getPorts"/>
    <allow send_destination="org.fedoraproject.FirewallD1"
           send_interface="org.fedoraproject.FirewallD1.zone"
           send_member="getRichRules"/>
  </policy>

  <!-- Unprivileged desktop sessions may invoke only strictly read-only getters -->
  <policy context="default">
    <deny own="tr.com.blazeos.Akrep1"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="tr.com.blazeos.Akrep1.Manager"
           send_member="GetVersion"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="tr.com.blazeos.Akrep1.Manager"
           send_member="GetCapabilities"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="tr.com.blazeos.Akrep1.Manager"
           send_member="GetSnapshot"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="tr.com.blazeos.Akrep1.Manager"
           send_member="GetFindings"/>
    <allow send_destination="tr.com.blazeos.Akrep1"
           send_interface="tr.com.blazeos.Akrep1.Manager"
           send_member="GetSectionDetail"/>
  </policy>
</busconfig>
